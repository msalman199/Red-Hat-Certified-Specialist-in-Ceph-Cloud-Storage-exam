apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-cloud
spec:
  serviceName: mysql-cloud
  replicas: 3
  selector:
    matchLabels:
      app: mysql-cloud
  template:
    metadata:
      labels:
        app: mysql-cloud
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "cloudpassword123"
        - name: MYSQL_DATABASE
          value: "cloudapp"
        ports:
        - containerPort: 3306
          name: mysql
        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
  volumeClaimTemplates:
  - metadata:
      name: mysql-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: rook-ceph-block-cloud
      resources:
        requests:
          storage: 10Gi
