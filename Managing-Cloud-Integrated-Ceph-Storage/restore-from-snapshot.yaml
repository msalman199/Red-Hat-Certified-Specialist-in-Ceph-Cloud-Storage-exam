apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-restore-pvc
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: rook-ceph-block-cloud
  dataSource:
    name: mysql-snapshot-1
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.io
